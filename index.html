<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MabarRoom — Satu Kode. Satu Room. Mabar Bareng.</title>
<meta name="description" content="Main Domino, Rummy, dan Cangkulan online bareng teman. Buat room, bagikan Team Code, voice chat langsung.">
<meta name="theme-color" content="#08090D">
<script>(function(){var p=location.pathname.replace(/\/join\/[^\/]*\/?$/,'/');if(p.slice(-1)!=='/')p=p.replace(/[^\/]*$/,'');document.write('<base href="'+p+'">')})()</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/upgrade.css">
</head>
<body>
<a class="skip" href="#app">Lewati ke konten</a>
<main id="app"></main>
<aside id="chatBox" class="chat glass" hidden aria-label="Chat room">
  <header>CHAT <button class="btn sm ghost" data-act="toggleChat" aria-label="Tutup chat">✕</button></header>
  <div id="msgs" aria-live="polite"></div>
  <div class="send"><input id="chatIn" class="inp" maxlength="200" placeholder="Ketik pesan…" autocomplete="off" aria-label="Pesan chat"><button class="btn sm" data-act="sendChat">Kirim</button></div>
</aside>
<div id="modal"></div>
<div id="toast" aria-live="polite"></div>
<div id="audio" style="position:fixed;left:-9999px"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="js/app.js"></script>
<noscript><p style="font:16px sans-serif;padding:20px">MabarRoom membutuhkan JavaScript.</p></noscript>
<script>setTimeout(function(){var a=document.getElementById('app');if(a&&!a.children.length){var f=location.protocol==='file:';
a.innerHTML='<div style="font:16px/1.5 sans-serif;max-width:560px;margin:40px auto;padding:20px;border:3px solid #000;background:#fff;color:#000"><h2>Aplikasi gagal dimuat</h2>'+
(f?'<p><b>Halaman dibuka langsung dari komputer (file://).</b> Browser memblokir modul JavaScript dari file lokal. Buka lewat alamat Netlify, atau jalankan server lokal: <code>npx serve public</code>.</p>':
'<p>File <code>css/</code> atau <code>js/</code> tidak ditemukan di samping <code>index.html</code>. Pastikan struktur deploy seperti ini:</p><pre>index.html\ncss/style.css\ncss/upgrade.css\njs/app.js ... (folder js lengkap)</pre><p>Di GitHub/Netlify, pengaturan <i>Publish directory</i> harus menunjuk ke folder yang berisi <code>index.html</code> tadi.</p>')+
'<p>Tekan F12 &rarr; Console untuk melihat file mana yang gagal (404).</p></div>'}},4000)</script>
</body>
</html>
